[project]
name = "tts"
version = "0.1.0"
description = "Translate Russian books to Ukrainian and turn them into audiobooks with StyleTTS2"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch>=2.8",
    "transformers>=5.0",
    "sentencepiece>=0.2",
    "sacremoses>=0.1",
    "soundfile>=0.13",
    "huggingface-hub>=1.0",
    "numpy<2",
    "styletts2-inference",
    "ipa-uk",
    "ukrainian-word-stress",
]

[tool.uv]
package = false

[tool.uv.sources]
styletts2-inference = { git = "https://github.com/patriotyk/styletts2-inference", rev = "209352700cf703a05ff94501290095dd9072fd5f" }
ipa-uk = { git = "https://github.com/patriotyk/ipa-uk.git", rev = "3faf05ec50fd4880965b6c76f8e479a4f82117f5" }
ukrainian-word-stress = { git = "https://github.com/patriotyk/ukrainian-word-stress.git", rev = "d5b37ea0abe9711930d9c3b0b13edec5a0675512" }
